[project]
name = "el-sca-ansamble"
version = "0.1.1"
description = "Resilient SCA orchestration wrapper for Trivy, Grype, Syft, cve-bin-tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
el-sca = "resilient_updates.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
# ruff.toml takes precedence; this section is a no-op stub kept for IDE discovery.

[tool.pytest.ini_options]
# pytest.ini takes precedence; this stub keeps tooling happy.
