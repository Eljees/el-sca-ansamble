# docker-compose.offline.yml — STRICT OFFLINE overlay.
#
# Apply it ON TOP of docker-compose.yml so no service ever reaches out to a
# registry: every image must already be present locally (built once on a
# network-enabled machine and shipped via scripts/export_images.sh, or pulled
# explicitly).  If an image is missing, compose fails loudly instead of
# silently downloading.
#
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml --profile scan up
#
# To make it the default for every command, set in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.offline.yml
#
# DB updates are already opt-in (profile "update"); this overlay closes the
# remaining hole — base-image / built-image pulls.  Building still works when
# you ask for it explicitly (`docker compose build`), it just never happens
# implicitly on `up`.
services:
  trivy-updater:        { pull_policy: never }
  trivy-scanner:        { pull_policy: never }
  grype-updater:        { pull_policy: never }
  grype-db-importer:    { pull_policy: never }
  grype-static:         { pull_policy: never }
  grype-scanner:        { pull_policy: never }
  syft-sbom:            { pull_policy: never }
  artifact-extractor:   { pull_policy: never }
  cve-bin-tool-updater: { pull_policy: never }
  cve-bin-tool-scanner: { pull_policy: never }
  db-admin:             { pull_policy: never }
  route-doctor:         { pull_policy: never }
  report-collector:     { pull_policy: never }
  stack-info:           { pull_policy: never }
  dashboard:            { pull_policy: never }
  db-exporter:          { pull_policy: never }
  db-importer:          { pull_policy: never }
