# ---------------------------------------------------------------------------
# Proxy support
#
# Set HTTP_PROXY / HTTPS_PROXY / NO_PROXY / ALL_PROXY in your .env file
# (copy .env.example → .env and fill in the values).
#
# If your SOCKS/HTTP proxy runs on the Windows/Linux host (127.0.0.1), use
# host.docker.internal instead of 127.0.0.1 so Docker containers can reach it:
#
#   ALL_PROXY=socks5h://host.docker.internal:1080
#   NO_PROXY=localhost,127.0.0.1,grype-static
#
# extra_hosts: [host.docker.internal:host-gateway] is already set on all
# network-using services — no manual /etc/hosts editing needed.
# ---------------------------------------------------------------------------

x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,grype-static}
  ALL_PROXY: ${ALL_PROXY:-}
  # lower-case variants honoured by curl, wget, Python requests, Go net/http
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,grype-static}
  all_proxy: ${ALL_PROXY:-}

services:
  stack-info:
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    working_dir: /workspace
    command: ["validate-config"]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  trivy-updater:
    image: aquasec/trivy:${TRIVY_VERSION:-0.64.1}
    # Updater services are opt-in only.  `update` is the explicit refresh
    # profile.  They are deliberately NOT in `default` (so `docker compose
    # up` without any profile never reaches out to upstream DB sources) and
    # NOT in `offline` / `airgap` (those mean "scan only with local DB").
    profiles: ["update"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/update_trivy.sh"]
    command: ["update", "${TRIVY_TARGET:-alpine:latest}"]
    environment:
      <<: *proxy-env
      TRIVY_CACHE_DIR: /var/lib/resilient-db/trivy
      TRIVY_RENDERED_FLAGS: ${TRIVY_RENDERED_FLAGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - trivy-cache:/var/lib/resilient-db/trivy
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  trivy-scanner:
    image: aquasec/trivy:${TRIVY_VERSION:-0.64.1}
    profiles: ["default", "scan", "offline", "airgap"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/update_trivy.sh"]
    command: ["scan", "${TRIVY_TARGET:-alpine:latest}"]
    environment:
      <<: *proxy-env
      TRIVY_CACHE_DIR: /var/lib/resilient-db/trivy
      TRIVY_RENDERED_FLAGS: ${TRIVY_RENDERED_FLAGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - trivy-cache:/var/lib/resilient-db/trivy
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  grype-updater:
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    # Opt-in only.  `test-failover` keeps it (suite drives updater explicitly).
    # Removed from `default` and `offline` — see comment on trivy-updater.
    profiles: ["update", "test-failover"]
    working_dir: /workspace
    command: ["update", "grype"]
    environment:
      <<: *proxy-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - grype-db:/var/lib/resilient-db/grype
      - ./artifacts:/workspace/artifacts
      - internal-mirror-data:/workspace/artifacts/mirror
    networks: [scanner-net]

  grype-db-importer:
    image: ghcr.io/anchore/grype:${GRYPE_VERSION:-v0.112.0}
    profiles: ["default", "update", "offline", "airgap"]
    environment:
      GRYPE_DB_CACHE_DIR: /grype-db-cache
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    command: ["db", "import", "/var/lib/resilient-db/grype/active/db.tar.zst"]
    volumes:
      - grype-db:/var/lib/resilient-db/grype:ro
      - grype-cache:/grype-db-cache
    networks: [scanner-net]

  grype-static:
    image: python:3.12-slim
    profiles: ["default", "scan", "test-failover", "offline", "airgap"]
    working_dir: /var/lib/resilient-db/grype/active
    command: ["python", "-m", "http.server", "8080"]
    volumes:
      - ./:/workspace
      - grype-db:/var/lib/resilient-db/grype
    networks: [scanner-net]
    healthcheck:
      # python:3.12-slim has no curl/wget — use python urllib directly.
      # Pings the directory index served by http.server; 2xx/3xx is treated as healthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).status<400 else 1)"]
      interval: 5s
      timeout: 3s
      # Stretched on 2026-05-17: docs/runbook.md §3.4 observed 5-20 s
      # stabilisation on cold Docker Desktop starts.  10 retries × 5s + 10s
      # start_period = up to ~60 s grace before grype-scanner blocks.
      retries: 10
      start_period: 10s

  grype-scanner:
    image: ghcr.io/anchore/grype:${GRYPE_VERSION:-v0.112.0}
    profiles: ["default", "scan", "offline", "airgap"]
    depends_on:
      grype-static:
        condition: service_healthy
    environment:
      GRYPE_DB_UPDATE_URL: http://grype-static:8080
      GRYPE_DB_VALIDATE_BY_HASH_ON_START: "true"
      GRYPE_DB_VALIDATE_AGE: "${GRYPE_DB_VALIDATE_AGE:-true}"
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "${GRYPE_DB_MAX_ALLOWED_BUILT_AGE:-168h}"
      GRYPE_DB_CACHE_DIR: /grype-db-cache
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    command: ["sbom:/workspace/artifacts/sbom/syft.json", "-o", "json", "--file", "/workspace/artifacts/reports/grype/report.json"]
    volumes:
      - ./:/workspace
      - grype-cache:/grype-db-cache
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  syft-sbom:
    image: ghcr.io/anchore/syft:${SYFT_VERSION:-v1.20.0}
    profiles: ["default", "scan", "offline", "airgap"]
    working_dir: /workspace
    environment:
      <<: *proxy-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "${SYFT_TARGET:-/scan-target}",
        "--from",
        "${SYFT_FROM:-dir}",
        "-o",
        "syft-json=/workspace/artifacts/sbom/syft.json",
        "-o",
        "cyclonedx-json=/workspace/artifacts/sbom/cyclonedx.json",
        "-o",
        "spdx-json=/workspace/artifacts/sbom/spdx.json",
      ]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  artifact-extractor:
    build:
      context: .
      dockerfile: Dockerfile.extractor
    profiles: ["default", "extract", "scan", "offline", "airgap"]
    working_dir: /workspace
    command:
      [
        "--input",
        "/input",
        "--output",
        "${EXTRACT_OUTPUT:-/workspace/artifacts/extracted/current}",
        "--max-depth",
        "${EXTRACT_MAX_DEPTH:-4}",
        "--max-files",
        "${EXTRACT_MAX_FILES:-20000}",
        "--max-bytes",
        "${EXTRACT_MAX_BYTES:-10737418240}",
        "--max-member-size-mb",
        "${EXTRACT_MAX_MEMBER_SIZE_MB:-0}",
      ]
    # Note: --skip-ext is per-call (repeatable flag).  Compose YAML lists can't
    # expand a comma-separated env var into N flags, so pass them via override:
    #   docker compose run --rm artifact-extractor --skip-ext .png --skip-ext .ttf
    # See docs/network-design.md / operations.md for examples.
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${EXTRACT_INPUT_HOST:-/tmp/el-sca-extract-input-not-set}
        target: /input
        read_only: true
    networks: [scanner-net]

  cve-bin-tool-updater:
    build:
      context: .
      dockerfile: Dockerfile.cve-bin-tool
    # Opt-in only.  Removed from `default` and `offline` — see comment on
    # trivy-updater.  Use `update` profile or `run-scan.ps1 -UpdateDb` to
    # trigger this explicitly.
    profiles: ["update"]
    working_dir: /workspace
    command: ["update", "${CVE_BIN_TOOL_TARGET:-/scan-target}"]
    environment:
      <<: *proxy-env
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_API_KEY_FALLBACK: ${NVD_API_KEY_FALLBACK:-}
      CVE_BIN_TOOL_UPDATE_MODES: ${CVE_BIN_TOOL_UPDATE_MODES:-}
      CVE_BIN_TOOL_UPDATE_TIMEOUT_SECONDS: ${CVE_BIN_TOOL_UPDATE_TIMEOUT_SECONDS:-}
      CVE_BIN_TOOL_SEED_TIMEOUT_SECONDS: ${CVE_BIN_TOOL_SEED_TIMEOUT_SECONDS:-}
      CVE_BIN_TOOL_SEED_AUX: ${CVE_BIN_TOOL_SEED_AUX:-}
      CVE_BIN_TOOL_OSV_ECOSYSTEMS: ${CVE_BIN_TOOL_OSV_ECOSYSTEMS:-}
      CVE_BIN_TOOL_DISABLE_SOURCES: ${CVE_BIN_TOOL_DISABLE_SOURCES:-}
      CVE_BIN_TOOL_DISABLE_SOURCES_ON_RETRY: ${CVE_BIN_TOOL_DISABLE_SOURCES_ON_RETRY:-}
      CVE_BIN_TOOL_DB_POLICY: ${CVE_BIN_TOOL_DB_POLICY:-}
      CVE_BIN_TOOL_USE_INTERNAL_MIRROR: ${CVE_BIN_TOOL_USE_INTERNAL_MIRROR:-}
      CVE_BIN_TOOL_MIRROR_URL: ${CVE_BIN_TOOL_MIRROR_URL:-}
      CVE_BIN_TOOL_BUNDLE_PATH: ${CVE_BIN_TOOL_BUNDLE_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - cve-bin-tool-cache:/root/.cache
      - ./artifacts:/workspace/artifacts
      - internal-mirror-data:/var/lib/resilient-db/cve-bin-tool
    networks: [scanner-net]

  cve-bin-tool-scanner:
    build:
      context: .
      dockerfile: Dockerfile.cve-bin-tool
    profiles: ["default", "scan", "offline", "airgap"]
    working_dir: /workspace
    command: ["scan", "${CVE_BIN_TOOL_TARGET:-/scan-target}"]
    environment:
      CVE_BIN_TOOL_SCAN_TIMEOUT_SECONDS: ${CVE_BIN_TOOL_SCAN_TIMEOUT_SECONDS:-1800}
      # SBOM fast-path: set to a CycloneDX/SPDX path to skip binary scanning.
      CVE_BIN_TOOL_SBOM_PATH: ${CVE_BIN_TOOL_SBOM_PATH:-}
      CVE_BIN_TOOL_SBOM_FORMAT: ${CVE_BIN_TOOL_SBOM_FORMAT:-cyclonedx}
      # Checker filter: empty = auto-detect, "all" = run all 365 checkers,
      # "go" or "go,rust,python" = language-only (fast, for Go/JVM/Rust targets)
      CVE_BIN_TOOL_CHECKERS: ${CVE_BIN_TOOL_CHECKERS:-}
      # Reserved for future cve-bin-tool versions.  In v3.4 this is logged as a
      # no-op because binary scans already use an internal CPU-count Pool.
      CVE_BIN_TOOL_PARALLEL: ${CVE_BIN_TOOL_PARALLEL:-}
      CVE_BIN_TOOL_DB_POLICY: ${CVE_BIN_TOOL_DB_POLICY:-}
    volumes:
      - ./:/workspace
      - cve-bin-tool-cache:/root/.cache
      - ./artifacts:/workspace/artifacts
      - internal-mirror-data:/var/lib/resilient-db/cve-bin-tool
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  db-admin:
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["default", "update", "scan", "report", "offline", "test-failover", "airgap"]
    working_dir: /workspace
    command: ["validate-config"]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - trivy-cache:/var/lib/resilient-db/trivy
      - grype-db:/var/lib/resilient-db/grype
      - grype-cache:/var/lib/resilient-db/grype-cache
      - cve-bin-tool-cache:/root/.cache
      - internal-mirror-data:/var/lib/resilient-db/cve-bin-tool
    networks: [scanner-net]

  # Read-only run dashboard (ADR-0006).  Browses artifacts/ over HTTP; holds no
  # secrets and performs no scans.  Published on loopback only.  Requires
  # fastapi + uvicorn in the image — regenerate requirements with `make lock`
  # and rebuild before `--profile dashboard up`.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["dashboard"]
    working_dir: /workspace
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080", "--artifacts-dir", "/workspace/artifacts"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./artifacts:/workspace/artifacts:ro
    networks: [scanner-net]

  mock-feed-server:
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["test-failover"]
    working_dir: /workspace
    entrypoint: ["python", "tests/mock_feed_server/app.py"]
    command: ["--host", "0.0.0.0", "--port", "18080"]
    volumes:
      - ./:/workspace
    networks: [scanner-net]

  report-collector:
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["default", "scan", "report", "update", "test-failover", "offline", "airgap"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/collect_reports.sh"]
    environment:
      REPORT_OUTPUT: ${REPORT_OUTPUT:-/workspace/artifacts/reports/final/cve_analysis_report_generated_ru.md}
      HTML_REPORT_OUTPUT: ${HTML_REPORT_OUTPUT:-/workspace/artifacts/reports/final/index.html}
      CASE_ID: ${CASE_ID:-CYBERSEC-UNKNOWN}
      SCAN_TARGET: ${SCAN_TARGET_CONTAINER:-/scan-target}
      SCAN_TARGET_HOST: ${SCAN_TARGET_HOST:-UNKNOWN}
      SCAN_TARGET_DISPLAY: ${SCAN_TARGET_DISPLAY:-${SCAN_TARGET_HOST:-UNKNOWN}}
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  # ── Specialized format analyzers ──────────────────────────────────────────

  apk-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.apk-analyzer
      args:
        JAVA_XMX: ${JAVA_XMX:-512m}
    profiles: ["apk"]
    working_dir: /workspace
    command:
      [
        "--input",  "/scan-target",
        "--output", "/workspace/artifacts",
      ]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST to the .apk file or directory}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  win-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.win-analyzer
    profiles: ["win"]
    working_dir: /workspace
    command:
      [
        "--input",  "/scan-target",
        "--output", "/workspace/artifacts",
      ]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST to the .exe/.msi file or directory}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  # ── OSV-Scanner (opt-in, profile "osv") ──────────────────────────────────
  #
  # Phase 5.4.  Google's OSV-Scanner is a second matching engine over
  # google/osv.dev data.  It complements Grype/Trivy because the OSV
  # database surfaces ecosystem advisories (Go, npm, pypi, Maven, …) faster
  # than the upstream-aggregated feeds that drive Grype.  Activate alongside
  # the regular scan profile:
  #
  #   COMPOSE_PROFILES=scan,osv docker compose up --abort-on-container-exit
  #
  # The scanner is given the artifacts/sbom/ directory and reads Syft's
  # CycloneDX / SPDX output (osv-scanner has native support for both).
  # Output: artifacts/reports/osv-scanner/report.json (and .sarif if you
  # add --format sarif via the OSV_SCANNER_ARGS env hook below).

  osv-scanner:
    image: ghcr.io/google/osv-scanner:${OSV_SCANNER_VERSION:-latest}
    profiles: ["osv"]
    working_dir: /workspace
    environment:
      <<: *proxy-env
      # User-extensible.  Examples:
      #   OSV_SCANNER_ARGS="--licenses --recursive --format sarif --output /workspace/artifacts/reports/osv-scanner/report.sarif"
      OSV_SCANNER_ARGS: ${OSV_SCANNER_ARGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /workspace/artifacts/reports/osv-scanner &&
        osv-scanner scan source
          --sbom /workspace/artifacts/sbom/cyclonedx.json
          --format json
          --output /workspace/artifacts/reports/osv-scanner/report.json
          $${OSV_SCANNER_ARGS}
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  # ── Network sidecars (opt-in, profile "proxy") ───────────────────────────
  #
  # See docs/network-design.md.  These sidecars form the chain
  #   scanner ──► tinyproxy:8888 ──► proxy-xray:1080 ──► (corp proxy / VPN / direct)
  # so every scanner has a single, stable proxy endpoint inside the docker
  # network — regardless of whether the host runs v2rayN, a corporate proxy
  # or nothing at all.  Disabled by default; enable with:
  #
  #   COMPOSE_PROFILES=scan,update,proxy docker compose up -d
  #
  # plus HTTP_PROXY=http://tinyproxy:8888  ALL_PROXY=socks5h://proxy-xray:1080
  # in .env so the existing x-proxy-env anchor sends scanners through them.

  proxy-xray:
    image: ghcr.io/xtls/xray-core:${XRAY_VERSION:-latest}
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./configs/xray:/etc/xray:ro
    command: ["run", "-c", "/etc/xray/config.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [scanner-net]
    healthcheck:
      # dokodemo-door inbound on 127.0.0.1:18080 just echoes TCP; a probe with
      # python urllib that gets ANY response (incl. ConnectionReset on close)
      # is enough to confirm the runtime is up.
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/1080"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  tinyproxy:
    image: kalaksi/tinyproxy:${TINYPROXY_VERSION:-1.11.2}
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      proxy-xray:
        condition: service_healthy
    volumes:
      - ./configs/tinyproxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    networks: [scanner-net]
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/8888"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s

  # ── VPN sidecar (opt-in, profile "vpn") ──────────────────────────────────
  #
  # When end-mirrors are only reachable from a VPN, enable this profile and
  # drop a wg0.conf into configs/wireguard/.  Then point xray's "upstream"
  # outbound at WG-tunnelled targets, or attach a scanner directly via
  #   network_mode: "service:wireguard"
  # in a docker-compose.override.yml.

  wireguard:
    image: linuxserver/wireguard:${WIREGUARD_VERSION:-latest}
    profiles: ["vpn"]
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - ./configs/wireguard:/config
      - /lib/modules:/lib/modules:ro
    environment:
      PUID: ${LOCAL_UID:-1000}
      PGID: ${LOCAL_GID:-1000}
      TZ:   ${TZ:-Etc/UTC}
    networks: [scanner-net]

volumes:
  trivy-cache:
  grype-db:
  grype-cache:
  cve-bin-tool-cache:
  internal-mirror-data:

networks:
  scanner-net:
    driver: bridge
