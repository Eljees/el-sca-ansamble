# ---------------------------------------------------------------------------
# Proxy support
#
# Set HTTP_PROXY / HTTPS_PROXY / NO_PROXY / ALL_PROXY in your .env file
# (copy .env.example → .env and fill in the values).
#
# If your SOCKS/HTTP proxy runs on the Windows/Linux host (127.0.0.1), use
# host.docker.internal instead of 127.0.0.1 so Docker containers can reach it:
#
#   ALL_PROXY=socks5h://host.docker.internal:1080
#   NO_PROXY=localhost,127.0.0.1,grype-static
#
# extra_hosts: [host.docker.internal:host-gateway] is already set on all
# network-using services — no manual /etc/hosts editing needed.
# ---------------------------------------------------------------------------

x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,grype-static}
  ALL_PROXY: ${ALL_PROXY:-}
  # lower-case variants honoured by curl, wget, Python requests, Go net/http
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,grype-static}
  all_proxy: ${ALL_PROXY:-}

services:
  stack-info:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    working_dir: /workspace
    command: ["validate-config"]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  trivy-updater:
    image: aquasec/trivy:${TRIVY_VERSION:-0.64.1}
    # Updater services are opt-in only.  `update` is the explicit refresh
    # profile.  They are deliberately NOT in `default` (so `docker compose
    # up` without any profile never reaches out to upstream DB sources) and
    # NOT in `offline` / `airgap` (those mean "scan only with local DB").
    profiles: ["update"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/update_trivy.sh"]
    command: ["update", "${TRIVY_TARGET:-alpine:latest}"]
    environment:
      <<: *proxy-env
      TRIVY_CACHE_DIR: /var/lib/resilient-db/trivy
      TRIVY_RENDERED_FLAGS: ${TRIVY_RENDERED_FLAGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - trivy-cache:/var/lib/resilient-db/trivy
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  trivy-scanner:
    image: aquasec/trivy:${TRIVY_VERSION:-0.64.1}
    profiles: ["default", "scan", "offline", "airgap"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/update_trivy.sh"]
    command: ["scan", "${TRIVY_TARGET:-alpine:latest}"]
    environment:
      <<: *proxy-env
      TRIVY_CACHE_DIR: /var/lib/resilient-db/trivy
      TRIVY_RENDERED_FLAGS: ${TRIVY_RENDERED_FLAGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - trivy-cache:/var/lib/resilient-db/trivy
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  grype-updater:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    # Opt-in only.  `test-failover` keeps it (suite drives updater explicitly).
    # Removed from `default` and `offline` — see comment on trivy-updater.
    profiles: ["update", "test-failover"]
    working_dir: /workspace
    command: ["update", "grype"]
    environment:
      <<: *proxy-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - grype-db:/var/lib/resilient-db/grype
      - ./artifacts:/workspace/artifacts
      - internal-mirror-data:/workspace/artifacts/mirror
    networks: [scanner-net]

  grype-db-importer:
    image: ghcr.io/anchore/grype:${GRYPE_VERSION:-v0.112.0}
    profiles: ["default", "update", "offline", "airgap"]
    environment:
      GRYPE_DB_CACHE_DIR: /grype-db-cache
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    command: ["db", "import", "/var/lib/resilient-db/grype/active/db.tar.zst"]
    volumes:
      - grype-db:/var/lib/resilient-db/grype:ro
      - grype-cache:/grype-db-cache
    networks: [scanner-net]

  grype-static:
    image: python:3.12-slim
    profiles: ["default", "scan", "test-failover", "offline", "airgap"]
    working_dir: /var/lib/resilient-db/grype/active
    command: ["python", "-m", "http.server", "8080"]
    volumes:
      - ./:/workspace
      - grype-db:/var/lib/resilient-db/grype
    networks: [scanner-net]
    healthcheck:
      # python:3.12-slim has no curl/wget — use python urllib directly.
      # Pings the directory index served by http.server; 2xx/3xx is treated as healthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).status<400 else 1)"]
      interval: 5s
      timeout: 3s
      # Stretched on 2026-05-17: docs/runbook.md §3.4 observed 5-20 s
      # stabilisation on cold Docker Desktop starts.  10 retries × 5s + 10s
      # start_period = up to ~60 s grace before grype-scanner blocks.
      retries: 10
      start_period: 10s

  grype-scanner:
    image: ghcr.io/anchore/grype:${GRYPE_VERSION:-v0.112.0}
    profiles: ["default", "scan", "offline", "airgap"]
    depends_on:
      grype-static:
        condition: service_healthy
    environment:
      GRYPE_DB_UPDATE_URL: http://grype-static:8080
      GRYPE_DB_VALIDATE_BY_HASH_ON_START: "true"
      GRYPE_DB_VALIDATE_AGE: "${GRYPE_DB_VALIDATE_AGE:-true}"
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "${GRYPE_DB_MAX_ALLOWED_BUILT_AGE:-168h}"
      GRYPE_DB_CACHE_DIR: /grype-db-cache
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    command: ["sbom:/workspace/artifacts/sbom/syft.json", "-o", "json", "--file", "/workspace/artifacts/reports/grype/report.json"]
    volumes:
      - ./:/workspace
      - grype-cache:/grype-db-cache
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  syft-sbom:
    image: ghcr.io/anchore/syft:${SYFT_VERSION:-v1.20.0}
    profiles: ["default", "scan", "offline", "airgap"]
    working_dir: /workspace
    environment:
      <<: *proxy-env
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "${SYFT_TARGET:-/scan-target}",
        "--from",
        "${SYFT_FROM:-dir}",
        "-o",
        "syft-json=/workspace/artifacts/sbom/syft.json",
        "-o",
        "cyclonedx-json=/workspace/artifacts/sbom/cyclonedx.json",
        "-o",
        "spdx-json=/workspace/artifacts/sbom/spdx.json",
      ]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  artifact-extractor:
    image: elariaphd/el-sca-extractor:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.extractor
    profiles: ["default", "extract", "scan", "offline", "airgap"]
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace:/opt/app
    command:
      [
        "--input",
        "/input",
        "--output",
        "${EXTRACT_OUTPUT:-/workspace/artifacts/extracted/current}",
        # Nested archives MUST be unpacked: a delivery zip usually contains
        # tar.gz / .deb / .rpm payloads, and the scanners can only see real
        # files.  With depth 0 (the old default) such an artifact produced a
        # silent all-zero report — extraction "passed", Syft catalogued 0
        # components, every scanner found nothing.  4 matches the CLI and
        # ExtractLimits defaults; runaway growth is bounded by --max-bytes.
        "--max-depth",
        "${EXTRACT_MAX_DEPTH:-4}",
        "--max-files",
        "${EXTRACT_MAX_FILES:-20000}",
        "--max-bytes",
        "${EXTRACT_MAX_BYTES:-10737418240}",
        "--max-member-size-mb",
        "${EXTRACT_MAX_MEMBER_SIZE_MB:-0}",
      ]
    # Note: --skip-ext is per-call (repeatable flag).  Compose YAML lists can't
    # expand a comma-separated env var into N flags, so pass them via override:
    #   docker compose run --rm artifact-extractor --skip-ext .png --skip-ext .ttf
    # See docs/network-design.md / operations.md for examples.
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${EXTRACT_INPUT_HOST:-/tmp/el-sca-extract-input-not-set}
        target: /input
        read_only: true
    networks: [scanner-net]

  cve-bin-tool-updater:
    image: elariaphd/el-sca-cve-bin-tool:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.cve-bin-tool
    # Opt-in only.  Removed from `default` and `offline` — see comment on
    # trivy-updater.  Use `update` profile or `run-scan.ps1 -UpdateDb` to
    # trigger this explicitly.
    profiles: ["update"]
    working_dir: /workspace
    command: ["update", "${CVE_BIN_TOOL_TARGET:-/scan-target}"]
    environment:
      <<: *proxy-env
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_API_KEY_FALLBACK: ${NVD_API_KEY_FALLBACK:-}
      CVE_BIN_TOOL_UPDATE_MODES: ${CVE_BIN_TOOL_UPDATE_MODES:-}
      CVE_BIN_TOOL_UPDATE_TIMEOUT_SECONDS: ${CVE_BIN_TOOL_UPDATE_TIMEOUT_SECONDS:-}
      CVE_BIN_TOOL_SEED_TIMEOUT_SECONDS: ${CVE_BIN_TOOL_SEED_TIMEOUT_SECONDS:-}
      CVE_BIN_TOOL_SEED_AUX: ${CVE_BIN_TOOL_SEED_AUX:-}
      CVE_BIN_TOOL_OSV_ECOSYSTEMS: ${CVE_BIN_TOOL_OSV_ECOSYSTEMS:-}
      CVE_BIN_TOOL_DISABLE_SOURCES: ${CVE_BIN_TOOL_DISABLE_SOURCES:-}
      CVE_BIN_TOOL_DISABLE_SOURCES_ON_RETRY: ${CVE_BIN_TOOL_DISABLE_SOURCES_ON_RETRY:-}
      CVE_BIN_TOOL_DB_POLICY: ${CVE_BIN_TOOL_DB_POLICY:-}
      CVE_BIN_TOOL_USE_INTERNAL_MIRROR: ${CVE_BIN_TOOL_USE_INTERNAL_MIRROR:-}
      CVE_BIN_TOOL_MIRROR_URL: ${CVE_BIN_TOOL_MIRROR_URL:-}
      CVE_BIN_TOOL_BUNDLE_PATH: ${CVE_BIN_TOOL_BUNDLE_PATH:-}
      # NVD 2.0 feed import (mode "feed"); FEED_BASE=file://... reads host-downloaded feeds.
      CVE_BIN_TOOL_FEED_BASE: ${CVE_BIN_TOOL_FEED_BASE:-}
      CVE_BIN_TOOL_FEED_START_YEAR: ${CVE_BIN_TOOL_FEED_START_YEAR:-}
      CVE_BIN_TOOL_FEED_END_YEAR: ${CVE_BIN_TOOL_FEED_END_YEAR:-}
      CVE_BIN_TOOL_FEED_ENRICH: ${CVE_BIN_TOOL_FEED_ENRICH:-}
      CVE_BIN_TOOL_ENRICH_PROXY: ${CVE_BIN_TOOL_ENRICH_PROXY:-}
      CVE_BIN_TOOL_ENRICH_DISABLE: ${CVE_BIN_TOOL_ENRICH_DISABLE:-}
      # GitHub PAT for the GAD (GitHub Advisory Database) source.  Set the value
      # in your gitignored .env (NEVER commit a real token — GitHub auto-revokes
      # any PAT pushed to a repo).  Empty = GAD skipped, all other sources still
      # update.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - cve-bin-tool-cache:/home/appuser/.cache
      - ./artifacts:/workspace/artifacts
      - internal-mirror-data:/var/lib/resilient-db/cve-bin-tool
    networks: [scanner-net]

  cve-bin-tool-scanner:
    image: elariaphd/el-sca-cve-bin-tool:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.cve-bin-tool
    profiles: ["default", "scan", "offline", "airgap"]
    working_dir: /workspace
    # Run the wrapper from the ALWAYS-mounted workspace, not the copy baked
    # into the image at build time: wrapper fixes then deploy via git pull
    # alone (the image bakes /opt/app/scripts as a fallback for bare runs).
    entrypoint: ["/bin/sh", "/workspace/scripts/update_cve_bin_tool.sh"]
    command: ["scan", "${CVE_BIN_TOOL_TARGET:-/scan-target}"]
    environment:
      # cve-bin-tool resolves its DB at $HOME/.cache/cve-bin-tool/cve.db. The
      # container runs as root (HOME=/root), but the DB volume is mounted at
      # /home/appuser/.cache — without pinning HOME there the offline scan fails
      # with "Database does not exist" (exit 40) despite a populated cve.db.
      HOME: /home/appuser
      XDG_CACHE_HOME: /home/appuser/.cache
      CVE_BIN_TOOL_SCAN_TIMEOUT_SECONDS: ${CVE_BIN_TOOL_SCAN_TIMEOUT_SECONDS:-1800}
      # Pre-scan DB audit toggle (1=verify, 0=skip).  Must be whitelisted here
      # or a host-side export never reaches the container.
      CVE_BIN_TOOL_VERIFY_DB: ${CVE_BIN_TOOL_VERIFY_DB:-1}
      # SBOM fast-path: set to a CycloneDX/SPDX path to skip binary scanning.
      CVE_BIN_TOOL_SBOM_PATH: ${CVE_BIN_TOOL_SBOM_PATH:-}
      CVE_BIN_TOOL_SBOM_FORMAT: ${CVE_BIN_TOOL_SBOM_FORMAT:-cyclonedx}
      # Checker filter: empty = auto-detect, "all" = run all 365 checkers,
      # "go" or "go,rust,python" = language-only (fast, for Go/JVM/Rust targets)
      CVE_BIN_TOOL_CHECKERS: ${CVE_BIN_TOOL_CHECKERS:-}
      # Reserved for future cve-bin-tool versions.  In v3.4 this is logged as a
      # no-op because binary scans already use an internal CPU-count Pool.
      CVE_BIN_TOOL_PARALLEL: ${CVE_BIN_TOOL_PARALLEL:-}
      CVE_BIN_TOOL_DB_POLICY: ${CVE_BIN_TOOL_DB_POLICY:-}
    volumes:
      - ./:/workspace
      - cve-bin-tool-cache:/home/appuser/.cache
      - ./artifacts:/workspace/artifacts
      - internal-mirror-data:/var/lib/resilient-db/cve-bin-tool
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  # ── Volume permission fix (profile "volinit") ────────────────────────────
  #
  # Docker creates named volumes owned by root; our updater/scanner containers
  # run as appuser (uid 1001, CIS 4.1) and cannot write to them — grype-updater
  # then dies with "Permission denied: /var/lib/resilient-db/grype/tmp/...", and
  # report-collector cannot overwrite a root-owned artifacts/summary.json.
  #
  # This root one-shot chowns each volume (and ./artifacts) to 1001 — idempotent
  # (skips volumes already correct).  It is in its OWN profile `volinit` so it
  # NEVER joins a normal `up`: `up --abort-on-container-exit` aborts on the first
  # container to exit, and a fast one-shot would tear the stack down.  Instead it
  # is run explicitly as a prep step (`--profile volinit run --rm volume-init`)
  # by update-db.sh, the MCP update_db and the dashboard orchestrator before any
  # updater starts.  Cross-platform: works on Windows Docker Desktop too.
  volume-init:
    image: alpine:3.20
    profiles: ["volinit"]
    user: "0"
    volumes:
      - grype-db:/vol/grype-db
      - grype-cache:/vol/grype-cache
      - trivy-cache:/vol/trivy-cache
      - cve-bin-tool-cache:/vol/cve-bin-tool-cache
      - internal-mirror-data:/vol/internal-mirror-data
      - ./artifacts:/vol/artifacts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Named DB volumes: only the uid-1001 containers write them -> chown 1001.
        # Check the whole tree, not just the volume root: a root-run (or a
        # non-recursive fix) can leave the root at 1001 while staging subdirs
        # (internal-mirror-data/{tmp,candidates,previous}) stay root-owned, and
        # then cve-bin-tool activation fails with EACCES on makedirs of
        # tmp/run-<ts> (shutil.copytree in activate_best_cve_bin_tool_db).
        # NB: busybox find has no GNU "-uid" (it errors "unrecognized: -uid");
        # with stderr swallowed that made this check silently pass forever and
        # root-owned DB files (e.g. cve.db after a root-run activation) were
        # never fixed -> cve-bin-tool-scanner (uid 1001) died instantly on a
        # database it could not open.  "! -user 1001" is busybox-compatible
        # (numeric uid accepted) and errors are no longer discarded.
        for d in /vol/grype-db /vol/grype-cache /vol/trivy-cache \
                 /vol/cve-bin-tool-cache /vol/internal-mirror-data; do
          strays=$$(find "$$d" ! -user 1001 -print -quit)
          if [ -n "$$strays" ]; then
            echo "[volume-init] chown 1001:1001 -R $$d (found non-1001 entries)"
            chown -R 1001:1001 "$$d"
          else
            echo "[volume-init] ok (whole tree already 1001): $$d"
          fi
        done
        # ./artifacts is a host bind-mount written by BOTH the host deploy-user
        # and the uid-1001 containers (report-collector, scanners + host-side
        # collect-report).  chown'ing it to either side locks the other out, so
        # make it world-writable (no sticky bit, so the host-side [clean] step
        # can still delete container-created files).  artifacts is non-sensitive
        # scan output; this removes all cross-uid permission conflicts on deploy.
        # Pre-create the standard artifact subdirs as 0777 BEFORE any scanner
        # runs.  The grype/trivy scanner containers run as root and would
        # otherwise create reports/ at 0755-root, locking the uid-1001
        # containers (cve-bin-tool-scanner, report-collector) out of writing
        # sibling dirs (reports/final, reports/cve-bin-tool).  Creating the
        # parents here means root scanners only add leaf dirs and appuser
        # containers can still write into the 0777 parents.
        echo "[volume-init] pre-creating shared artifact subdirs (0777)"
        mkdir -p /vol/artifacts/reports/final /vol/artifacts/reports/cve-bin-tool \
                 /vol/artifacts/reports/grype /vol/artifacts/reports/trivy \
                 /vol/artifacts/extracted/current /vol/artifacts/sbom \
                 /vol/artifacts/db_status
        echo "[volume-init] making /vol/artifacts world-writable (shared host/uid-1001)"
        chmod -R 0777 /vol/artifacts 2>/dev/null || true
    networks: [scanner-net]

  db-admin:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["default", "update", "scan", "report", "offline", "test-failover", "airgap"]
    working_dir: /workspace
    command: ["validate-config"]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - trivy-cache:/var/lib/resilient-db/trivy
      - grype-db:/var/lib/resilient-db/grype
      - grype-cache:/var/lib/resilient-db/grype-cache
      - cve-bin-tool-cache:/home/appuser/.cache
      - internal-mirror-data:/var/lib/resilient-db/cve-bin-tool
    networks: [scanner-net]

  # ── Route doctor (ADR-0007 P2) ───────────────────────────────────────────
  #
  # Runs INSIDE scanner-net and works out, from here, which egress is alive —
  # the in-network sidecars (tinyproxy:8888 / proxy-xray:1080), the host's local
  # proxy (host.docker.internal:<port>), or a direct route — then writes
  #   artifacts/route-plan.json   (full decision + reachability matrix)
  #   artifacts/route-plan.env    (HTTP_PROXY/ALL_PROXY/CVE_BIN_TOOL_ENRICH_PROXY
  #                                the updater containers source)
  # so every updater routes through the SAME chosen path regardless of the
  # operator's tunnel/proxy/VPN setup.  Read-only w.r.t. the DBs; opt-in.
  #
  #   docker compose --profile route run --rm route-doctor
  #
  # Add the docker-compose.route-doctor.yml override to also retarget the xray
  # sidecar's upstream at the live host proxy (--write-xray).
  route-doctor:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    # ONLY the "route" profile: it must never be part of "update"/"scan" —
    # `make update` runs `up --abort-on-container-exit`, and a quickly-exiting
    # route-doctor would tear the long-running updaters down mid-pull.  It is
    # always invoked explicitly via `compose --profile route run --rm`.
    profiles: ["route"]
    working_dir: /workspace
    command: ["route-plan", "--json", "--artifacts-dir", "/workspace/artifacts"]
    environment:
      <<: *proxy-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  # Read-only run dashboard (ADR-0006).  Browses artifacts/ over HTTP; holds no
  # secrets and performs no scans from inside the container.  For the active
  # drag-and-drop GUI, launch on the host with:
  #   python -m resilient_updates.cli dashboard --repo-root . --port 8080
  # Published on loopback only.
  dashboard:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["dashboard"]
    working_dir: /workspace
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080", "--artifacts-dir", "/workspace/artifacts"]
    environment:
      EL_SCA_DASHBOARD_ACTIVE: "0"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./configs:/workspace/configs:ro
    networks: [scanner-net]

  mock-feed-server:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["test-failover"]
    working_dir: /workspace
    entrypoint: ["python", "tests/mock_feed_server/app.py"]
    command: ["--host", "0.0.0.0", "--port", "18080"]
    volumes:
      - ./:/workspace
    networks: [scanner-net]

  report-collector:
    image: elariaphd/el-sca-resilient-updater:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.resilient-updater
    profiles: ["default", "scan", "report", "update", "test-failover", "offline", "airgap"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/collect_reports.sh"]
    environment:
      REPORT_OUTPUT: ${REPORT_OUTPUT:-/workspace/artifacts/reports/final/cve_analysis_report_generated_ru.md}
      HTML_REPORT_OUTPUT: ${HTML_REPORT_OUTPUT:-/workspace/artifacts/reports/final/index.html}
      CASE_ID: ${CASE_ID:-CYBERSEC-UNKNOWN}
      SCAN_TARGET: ${SCAN_TARGET_CONTAINER:-/scan-target}
      SCAN_TARGET_HOST: ${SCAN_TARGET_HOST:-UNKNOWN}
      SCAN_TARGET_DISPLAY: ${SCAN_TARGET_DISPLAY:-${SCAN_TARGET_HOST:-UNKNOWN}}
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST in .env to the path of the archive or directory to scan. See .env.example}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  # ── Specialized format analyzers ──────────────────────────────────────────

  apk-analyzer:
    image: elariaphd/el-sca-apk-analyzer:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.apk-analyzer
      args:
        JAVA_XMX: ${JAVA_XMX:-512m}
    profiles: ["apk"]
    working_dir: /workspace
    command:
      [
        "--input",  "/scan-target",
        "--output", "/workspace/artifacts",
      ]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST to the .apk file or directory}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  win-analyzer:
    image: elariaphd/el-sca-win-analyzer:${EL_SCA_VERSION:-0.1.5}
    build:
      context: .
      dockerfile: Dockerfile.win-analyzer
    profiles: ["win"]
    working_dir: /workspace
    command:
      [
        "--input",  "/scan-target",
        "--output", "/workspace/artifacts",
      ]
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - type: bind
        source: ${SCAN_TARGET_HOST:?Set SCAN_TARGET_HOST to the .exe/.msi file or directory}
        target: /scan-target
        read_only: true
    networks: [scanner-net]

  # ── OSV-Scanner (opt-in, profile "osv") ──────────────────────────────────
  #
  # Phase 5.4.  Google's OSV-Scanner is a second matching engine over
  # google/osv.dev data.  It complements Grype/Trivy because the OSV
  # database surfaces ecosystem advisories (Go, npm, pypi, Maven, …) faster
  # than the upstream-aggregated feeds that drive Grype.  Activate alongside
  # the regular scan profile:
  #
  #   COMPOSE_PROFILES=scan,osv docker compose up --abort-on-container-exit
  #
  # The scanner is given the artifacts/sbom/ directory and reads Syft's
  # CycloneDX / SPDX output (osv-scanner has native support for both).
  # Output: artifacts/reports/osv-scanner/report.json (and .sarif if you
  # add --format sarif via the OSV_SCANNER_ARGS env hook below).

  osv-scanner:
    image: ghcr.io/google/osv-scanner:${OSV_SCANNER_VERSION:-latest}
    profiles: ["osv"]
    working_dir: /workspace
    environment:
      <<: *proxy-env
      # User-extensible.  Examples:
      #   OSV_SCANNER_ARGS="--licenses --recursive --format sarif --output /workspace/artifacts/reports/osv-scanner/report.sarif"
      OSV_SCANNER_ARGS: ${OSV_SCANNER_ARGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /workspace/artifacts/reports/osv-scanner &&
        osv-scanner scan source
          --sbom /workspace/artifacts/sbom/cyclonedx.json
          --format json
          --output /workspace/artifacts/reports/osv-scanner/report.json
          $${OSV_SCANNER_ARGS}
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
    networks: [scanner-net]

  # ── Internal S3-compatible storage (MVP) ─────────────────────────────────
  #
  # SeaweedFS gives the stack one lightweight S3-compatible bucket for scanner
  # DB snapshots and scan results.  This is intentionally independent from the
  # scanner update flow: scripts/s3_storage.sh publishes/pulls already-validated
  # DB bundles and archived scan runs through the S3 API.
  #
  #   docker compose --profile storage up -d seaweedfs
  #   ./scripts/s3_storage.sh init
  #   ./scripts/s3_storage.sh db-push
  #   ./scripts/s3_storage.sh results-push

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.38}
    profiles: ["storage"]
    restart: unless-stopped
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-ip=seaweedfs",
        "-ip.bind=0.0.0.0",
      ]
    ports:
      - "127.0.0.1:${EL_SCA_S3_PORT:-8333}:8333"
    volumes:
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    networks: [scanner-net]

  s3-client:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    profiles: ["storage-tools"]
    depends_on:
      seaweedfs:
        condition: service_started
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-lc"]
    environment:
      EL_SCA_S3_ENDPOINT: ${EL_SCA_S3_ENDPOINT:-http://seaweedfs:8333}
      EL_SCA_S3_BUCKET: ${EL_SCA_S3_BUCKET:-el-sca}
      EL_SCA_S3_ACCESS_KEY: ${EL_SCA_S3_ACCESS_KEY:-el-sca}
      EL_SCA_S3_SECRET_KEY: ${EL_SCA_S3_SECRET_KEY:-el-sca-secret}
      EL_SCA_S3_ALIAS: ${EL_SCA_S3_ALIAS:-elsca}
    volumes:
      - ./:/workspace
      - ./artifacts:/workspace/artifacts
      - ./incoming:/workspace/incoming
    networks: [scanner-net]

  # ── Network sidecars (opt-in, profile "proxy") ───────────────────────────
  #
  # See docs/network-design.md.  These sidecars form the chain
  #   scanner ──► tinyproxy:8888 ──► proxy-xray:1080 ──► (corp proxy / VPN / direct)
  # so every scanner has a single, stable proxy endpoint inside the docker
  # network — regardless of whether the host runs v2rayN, a corporate proxy
  # or nothing at all.  Disabled by default; enable with:
  #
  #   COMPOSE_PROFILES=scan,update,proxy docker compose up -d
  #
  # plus HTTP_PROXY=http://tinyproxy:8888  ALL_PROXY=socks5h://proxy-xray:1080
  # in .env so the existing x-proxy-env anchor sends scanners through them.

  proxy-xray:
    image: ghcr.io/xtls/xray-core:${XRAY_VERSION:-latest}
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./configs/xray:/etc/xray:ro
    command: ["run", "-c", "/etc/xray/config.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [scanner-net]
    healthcheck:
      # xray-core image is distroless (no sh/wget/curl in PATH), so the former
      # "echo > /dev/tcp" probe caused FailingStreak > 20000 while the proxy
      # was actually working fine.  Disable the healthcheck; liveness is
      # confirmed by tinyproxy's ability to forward through it.
      disable: true

  tinyproxy:
    image: kalaksi/tinyproxy:${TINYPROXY_VERSION:-1.11.2}
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      proxy-xray:
        # NOT service_healthy: proxy-xray's healthcheck is disabled (distroless
        # image, no shell to probe with), so a health condition can never be
        # met and `--profile proxy up` would hang/fail on the dependency.
        condition: service_started
    volumes:
      - ./configs/tinyproxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    networks: [scanner-net]
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/8888"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s

  # ── VPN sidecar (opt-in, profile "vpn") ──────────────────────────────────
  #
  # When end-mirrors are only reachable from a VPN, enable this profile and
  # drop a wg0.conf into configs/wireguard/.  Then point xray's "upstream"
  # outbound at WG-tunnelled targets, or attach a scanner directly via
  #   network_mode: "service:wireguard"
  # in a docker-compose.override.yml.

  wireguard:
    image: linuxserver/wireguard:${WIREGUARD_VERSION:-latest}
    profiles: ["vpn"]
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - ./configs/wireguard:/config
      - /lib/modules:/lib/modules:ro
    environment:
      PUID: ${LOCAL_UID:-1000}
      PGID: ${LOCAL_GID:-1000}
      TZ:   ${TZ:-Etc/UTC}
    networks: [scanner-net]

  # ───────────────────────────────────────────────────────────────────────
  # DB bundle export / import (profile "db-bundle").
  #
  # Move the *current* vulnerability databases between hosts so a fresh
  # deployment ships with bases already loaded (no online update needed for
  # the first scan).  Compose resolves the real (project-prefixed) volume
  # names automatically — no manual name guessing required.
  #
  #   export → ./artifacts/db-image/<volume>.tar.gz   (then baked into an image)
  #   import ← ./incoming/<volume>.tar.gz             (unpacked from that image)
  #
  # See scripts/export_db_image.sh / import_db_image.sh and docs/SHIP_AND_DEPLOY.md.
  # ───────────────────────────────────────────────────────────────────────
  db-exporter:
    image: alpine:3.20
    profiles: ["db-bundle"]
    volumes:
      - trivy-cache:/vol/trivy-cache:ro
      - grype-db:/vol/grype-db:ro
      - grype-cache:/vol/grype-cache:ro
      - cve-bin-tool-cache:/vol/cve-bin-tool-cache:ro
      - internal-mirror-data:/vol/internal-mirror-data:ro
      - ./artifacts/db-image:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /out
        for v in trivy-cache grype-db grype-cache cve-bin-tool-cache internal-mirror-data; do
          echo "export $$v"
          tar -C /vol/$$v -czf /out/$$v.tar.gz .
        done
        echo "db bundle written to ./artifacts/db-image:"
        ls -lh /out

  db-importer:
    image: alpine:3.20
    profiles: ["db-bundle"]
    volumes:
      - trivy-cache:/vol/trivy-cache
      - grype-db:/vol/grype-db
      - grype-cache:/vol/grype-cache
      - cve-bin-tool-cache:/vol/cve-bin-tool-cache
      - internal-mirror-data:/vol/internal-mirror-data
      - ./incoming:/in:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for v in trivy-cache grype-db grype-cache cve-bin-tool-cache internal-mirror-data; do
          if [ -f /in/$$v.tar.gz ]; then
            echo "import $$v"
            tar -C /vol/$$v -xzf /in/$$v.tar.gz
          else
            echo "skip $$v (no archive in ./incoming)"
          fi
        done
        echo "db volumes restored from ./incoming"

volumes:
  trivy-cache:
  grype-db:
  grype-cache:
  cve-bin-tool-cache:
  internal-mirror-data:
  seaweedfs-data:

networks:
  scanner-net:
    driver: bridge
