name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Single source of truth for hooks: run pre-commit against the whole
  # tree.  If this passes, every lint job below should pass too.
  # Decoupling the per-tool jobs is still useful because pre-commit
  # collapses output and matrix builds give per-tool status badges.
  # ─────────────────────────────────────────────────────────────────────
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install "pre-commit>=3"
      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # ─────────────────────────────────────────────────────────────────────
  # Static checks — fast feedback, run first.  Kept independent of
  # pre-commit so badges show which specific lint family is red.
  # ─────────────────────────────────────────────────────────────────────
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5"
      - name: ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: byte-compile every Python module
        run: python -m compileall -q resilient_updates tests

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: ./scripts
          ignore_paths: scripts/windows

  # SAST gate: MEDIUM+ findings in runtime code block the build; LOW is
  # reported only (long-standing accepted findings carry # nosec markers).
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7"
      - name: bandit (medium+ blocks)
        run: bandit -q -r resilient_updates tools --severity-level medium

  lint-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.resilient-updater
          - Dockerfile.extractor
          - Dockerfile.cve-bin-tool
          - Dockerfile.apk-analyzer
          - Dockerfile.win-analyzer
    steps:
      - uses: actions/checkout@v4
      - name: hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yamllint>=1.35"
      - run: yamllint -s -c .yamllint .

  lint-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $issues = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $errors = @($issues | Where-Object Severity -eq 'Error')
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
          }
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────────
  # Compose schema check — catches typos in profiles, missing volumes, etc.
  # ─────────────────────────────────────────────────────────────────────
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (base)
        run: docker compose config -q
      - name: docker compose config (windows overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.windows.override.yml config -q

  # ─────────────────────────────────────────────────────────────────────
  # docker build for every Dockerfile we ship.  hadolint catches
  # surface-level mistakes; this catches real build failures.
  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-docker]
    strategy:
      fail-fast: false
      matrix:
        service:
          - resilient-updater
          - extractor
          - cve-bin-tool
          - apk-analyzer
          - win-analyzer
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build ${{ matrix.service }}
        env:
          SCAN_TARGET_HOST: ${{ github.workspace }}
          EXTRACT_INPUT_HOST: ${{ github.workspace }}
        run: docker compose build ${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────────────
  # Fast sanity gate — only @pytest.mark.smoke tests.  Runs before the full
  # suite so regressions on critical-path modules are visible in < 30 s.
  # ─────────────────────────────────────────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8"
      - name: pytest smoke
        run: pytest -q -m smoke --tb=short

  # Unit + integration tests.
  # Coverage gate keeps regressions visible.  Tune --cov-fail-under as
  # purpose-built tests grow.  See docs/audit/30-tests.md section 4.
  # ─────────────────────────────────────────────────────────────────────
  pytest:
    runs-on: ubuntu-latest
    needs: [smoke]
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the primary target (coverage-gated); 3.10 mirrors the oldest
        # supported interpreter and validates the datetime.UTC skip guards.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the canonical lockfile (produced by `make lock`).
          # Keep this consistent with the smoke job; do not branch on the stale
          # requirements.lock placeholder.
          pip install -r requirements.txt
          pip install "pytest>=8" "pytest-cov>=5"
      - name: pytest with coverage gate
        run: |
          GATE=""
          if [ "${{ matrix.python-version }}" = "3.12" ]; then GATE="--cov-fail-under=75"; fi
          pytest -q --disable-warnings \
            --cov=resilient_updates \
            --cov-report=term-missing \
            --cov-report=xml \
            $GATE
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14
