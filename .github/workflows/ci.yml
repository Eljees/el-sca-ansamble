name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Static checks — fast feedback, run first.
  # ─────────────────────────────────────────────────────────────────────
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5"
      - name: ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: byte-compile every Python module
        run: python -m compileall -q resilient_updates tests

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: ./scripts
          ignore_paths: scripts/windows

  lint-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.resilient-updater
          - Dockerfile.extractor
          - Dockerfile.cve-bin-tool
          - Dockerfile.apk-analyzer
          - Dockerfile.win-analyzer
    steps:
      - uses: actions/checkout@v4
      - name: hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # The shared config controls which rules and rule overrides apply.
          config: .hadolint.yaml

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yamllint>=1.35"
      - run: yamllint -s -c .yamllint .

  lint-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $issues = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $errors = @($issues | Where-Object Severity -eq 'Error')
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
          }
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────────
  # Compose schema check — catches typos in profiles, missing volumes, etc.
  # ─────────────────────────────────────────────────────────────────────
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (base)
        run: docker compose config -q
      - name: docker compose config (windows overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.windows.override.yml config -q

  # ─────────────────────────────────────────────────────────────────────
  # Unit + integration tests.
  # ─────────────────────────────────────────────────────────────────────
  pytest:
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # Prefer the lockfile when it exists.
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install "pytest>=8" "pytest-cov>=5"
      - name: pytest
        run: pytest -q --maxfail=1 --disable-warnings --cov=resilient_updates --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: .coverage
          if-no-files-found: ignore
          retention-days: 14
