# tinyproxy.conf — sidecar HTTP/HTTPS front for el-sca-ansamble.
#
# Scanners that only honour HTTP_PROXY / HTTPS_PROXY (Go net/http in Trivy,
# Grype, Syft; curl/wget in cve-bin-tool) connect here.  Every request is
# forwarded upstream to the xray sidecar over SOCKS5 — that's the single
# place where the outbound chain (corp proxy / VPN / direct) is configured.
#
# Reachable from within docker network 'scanner-net' as http://tinyproxy:8888.

User nobody
Group nogroup

Port 8888
Listen 0.0.0.0

Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatHost   "tinyproxy.stats"
StatFile   "/usr/share/tinyproxy/stats.html"

LogLevel Info
PidFile  "/run/tinyproxy/tinyproxy.pid"

MaxClients 100

# Lock connections to the docker compose 'scanner-net' bridge.  The default
# bridge subnet for docker compose v2 networks is in the 172.18.0.0/16 range,
# but we accept the broader 172.16/12 RFC1918 block to cover custom bridge
# settings and stay robust if compose re-numbers networks.
Allow 127.0.0.1
Allow 172.16.0.0/12

ViaProxyName "tinyproxy"

# Forward absolutely everything upstream to xray on SOCKS5.
# tinyproxy ≥1.11 supports socks5 upstreams natively.
upstream socks5 proxy-xray:1080

# Keep CONNECT (HTTPS tunnelling) open for any port scanners use; restrict if
# you have stronger requirements.
ConnectPort 443
ConnectPort 563
ConnectPort 80
ConnectPort 8080
ConnectPort 8443
ConnectPort 5443
