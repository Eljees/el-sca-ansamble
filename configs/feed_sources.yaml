# ---------------------------------------------------------------------------
# Proxy settings
#
# Two configuration styles are supported.  Pick ONE; the loader detects which
# you used.  Both are optional — leaving the whole section blank inherits from
# HTTP_PROXY / HTTPS_PROXY / NO_PROXY / ALL_PROXY env vars.
#
# --- Style A: flat (legacy, simplest) --------------------------------------
# proxy:
#   http:     "socks5h://host.docker.internal:1080"
#   https:    "socks5h://host.docker.internal:1080"
#   no_proxy: "localhost,127.0.0.1,grype-static"
#
# --- Style B: named chains with failover (recommended) ----------------------
# Multiple proxy paths are declared as "chains".  Each chain is a list of
# hops; the actual requests.Session is built from the last reachable hop
# (the entry the scanner connects to first).  ProxyRouter pings every chain
# in `policies.failover_order`, picks the first healthy one, and pins it
# until the cached state expires (TTL = healthcheck_ttl seconds).
#
# Schemes accepted on each hop: http, https, socks4, socks4a, socks5, socks5h.
# Special role "vpn" is metadata for ProxyRouter — it expects the WG sidecar
# (profile "vpn") to be up; ProxyRouter does NOT bring WG itself.
# ---------------------------------------------------------------------------
proxy:
  http: ""
  https: ""
  no_proxy: "localhost,127.0.0.1,grype-static,tinyproxy,proxy-xray"

  # Default chain when nothing else dictates a choice.  Override per-source
  # below in proxy.per_source[*].chain.
  default_chain: corp

  chains:
    direct:
      description: "No proxy — goes straight out the docker bridge."
      hops: []
    corp:
      description: "Sidecar tinyproxy ⟶ xray ⟶ whatever xray's outbound chains to."
      hops:
        - role: front
          url: "http://tinyproxy:8888"
        - role: socks
          url: "socks5h://proxy-xray:1080"
    via-vpn:
      description: "WireGuard sidecar carries the egress; SOCKS5 enters via xray."
      hops:
        - role: vpn
          interface: wg0
        - role: socks
          url: "socks5h://proxy-xray:1080"

  policies:
    healthcheck_url: "https://www.google.com/generate_204"
    healthcheck_timeout_seconds: 5
    healthcheck_ttl_seconds: 60
    failover_order: ["corp", "via-vpn", "direct"]
    retry_per_chain: 2

  # Pin specific upstream sources to specific chains.  Anything not listed
  # uses default_chain.  `source` is the `name:` from any of the
  # trivy.*_repositories / grype.upstream_update_urls / cve_bin_tool.mirrors /
  # custom_sources.entries lists.
  per_source:
    - source: anchore-public-db
      chain: corp
    - source: ghcr-trivy-db
      chain: corp
    - source: primary-mirror
      chain: corp

trivy:
  db_repositories:
    - name: internal-trivy-db
      url: "oci://registry.example.invalid/trivy-db"
      priority: 10
      enabled: false
    - name: ghcr-trivy-db
      url: "oci://ghcr.io/aquasecurity/trivy-db:2"
      priority: 20
      enabled: true
    - name: public-ecr-trivy-db
      url: "oci://public.ecr.aws/aquasecurity/trivy-db:2"
      priority: 30
      enabled: true
  java_db_repositories:
    - name: internal-trivy-java-db
      url: "oci://registry.example.invalid/trivy-java-db"
      priority: 10
      enabled: false
    - name: ghcr-trivy-java-db
      url: "oci://ghcr.io/aquasecurity/trivy-java-db:1"
      priority: 20
      enabled: true
  checks_bundle_repositories:
    - name: internal-trivy-checks
      url: "oci://registry.example.invalid/trivy-checks:0"
      priority: 10
      enabled: false
    - name: ghcr-trivy-checks
      url: "oci://ghcr.io/aquasecurity/trivy-checks:0"
      priority: 20
      enabled: true
  vex_repositories:
    - name: internal-vex-hub
      url: "https://vex.example.invalid/api"
      format: openvex          # openvex | csaf | cyclonedx
      priority: 10
      enabled: true
  # VEX application policy (see docs/adr/0003-vex-feed.md).  Disabled by
  # default — scans behave exactly as before until a VEX doc is published
  # and this is flipped on.
  vex_policy:
    enabled: false
    mode: apply                # apply (suppress) | annotate (mark only)
    require_fresh_hours: 168
  cache_dir: "/var/lib/resilient-db/trivy"
  offline_policy:
    skip_db_update: false
    skip_java_db_update: false
    skip_check_update: false
    offline_scan: false
  retry_backoff_policy:
    retry_count: 2
    timeout_seconds: 10
    backoff_seconds: 2
    retry_status_codes: [429, 500, 502, 503, 504]
  source_health_policy:
    enabled: true
    healthcheck_timeout_seconds: 5
    max_consecutive_failures: 3
  db_status:
    warning_age: "24h"

grype:
  internal_update_url: "http://grype-static:8080/v6/latest.json"
  upstream_update_urls:
    - name: internal-grype-mirror
      url: "http://grype-static:8080/v6/latest.json"
      priority: 10
      enabled: false
      notes: "Enable only when grype-static is intentionally serving a preseeded local mirror."
    - name: anchore-public-db
      url: "https://grype.anchore.io/databases/v6/latest.json"
      priority: 20
      enabled: true
  validation:
    validate_hash: true
    validate_age: true
    max_allowed_built_age: "72h"
  timeout_policy:
    update_available_timeout: 10
    update_download_timeout: 30
  # retry_backoff_policy used by update_grype for the listing-fetch phase
  # (probing each source quickly).  Short retry on purpose: if source N's
  # listing endpoint stalls, we want to fall through to source N+1 rather
  # than burn time on the same probe.  See docs/audit/20-architecture.md
  # section 2.
  retry_backoff_policy:
    retry_count: 1
    timeout_seconds: 10
    backoff_seconds: 1
    retry_status_codes: [429, 500, 502, 503, 504]
  last_known_good:
    enabled: true
    max_age: "168h"
    fail_closed_if_missing: true
  atomic_activation_policy:
    temp_dir: "/var/lib/resilient-db/grype/tmp"
    active_dir: "/var/lib/resilient-db/grype/active"
    previous_dir: "/var/lib/resilient-db/grype/previous"
    provenance_path: "artifacts/provenance/grype.json"
  db_status:
    warning_age: "24h"

cve_bin_tool:
  # json-nvd is the primary route: it downloads NVD year-files (nvdcve-*.json.gz)
  # that are correctly detected by the NVD audit check. json-mirror downloads a
  # pre-built DB and falls back to cve_metrics-based NVD detection.
  nvd_modes: ["json-nvd", "json-mirror", "api2"]
  data_sources:
    - NVD
    - OSV
    - GAD
    - REDHAT
    - CURL
    - EPSS
    - PURL2CPE
    - RSD
  # No internal cve-bin-tool bundle mirror is active for this contour. Keep this
  # list empty until a real reachable mirror replaces the old example.invalid
  # placeholders.
  mirrors: []
  export_import:
    export_bundle_path: "artifacts/mirror/cve-bin-tool-export.json"
    import_bundle_path: "artifacts/mirror/cve-bin-tool-export.json"
  update_schedule:
    default: "daily"
    allowed: ["now", "daily", "never", "latest"]
  offline_policy:
    offline: false
    import_first: true
    use_last_known_good: true
  source_health_policy:
    enabled: true
    source_timeout_seconds: 10
    retry_count: 2
  seed_policy:
    seed_epss: true
    # OSV auxiliary bulk seed is intentionally not on the critical DB refresh
    # path: on Windows Docker Desktop it can write hundreds of thousands of
    # files and has repeatedly failed with transient I/O errors. Keep OSV as
    # a separate enrichment task, not a blocker for NVD/GAD/REDHAT activation.
    seed_osv_on_update: false
    osv_ecosystems:
      - Debian
      - Ubuntu
      - Alpine
      - Go
      - PyPI
      - Maven
      - npm
      - Rust
  db_audit:
    # NVD check: cve-bin-tool stores NVD data as nvdcve-YYYY.json.gz files (for
    # json-nvd/api2 modes) or in cve_metrics table (json-mirror pre-built DBs).
    # The audit counts nvdcve files first; min_entries=20 requires at least 20
    # year-files (2002-2026 = 25 files). For json-mirror DBs without year-files,
    # the fallback checks cve_metrics row count (which is also > 20 when NVD is
    # embedded). Keep NVD as required so an empty DB is always rejected.
    db_policy: "degraded-ok"
    required_sources:
      - NVD
    min_entries:
      NVD: 20
    max_cache_age: "168h"
    fail_closed_if_required_missing: true
    activation_policy:
      temp_dir: "/var/lib/resilient-db/cve-bin-tool/tmp"
      active_dir: "/var/lib/resilient-db/cve-bin-tool/active"
      previous_dir: "/var/lib/resilient-db/cve-bin-tool/previous"
      provenance_path: "artifacts/provenance/cve-bin-tool-db.json"
  db_status:
    warning_age: "24h"

syft:
  scan_sources:
    - registry
    - docker
    - podman
    - containerd
    - docker-archive
    - oci-archive
    - oci-dir
    - dir
    - file
  default_from: "registry"
  output_formats:
    - syft-json
    - cyclonedx-json
    - spdx-json
  auth:
    docker_config_mount_path: "/root/.docker/config.json"
    registry_username_env: "SYFT_REGISTRY_USERNAME"
    registry_password_env: "SYFT_REGISTRY_PASSWORD"
  handoff_to_grype: true

custom_sources:
  allow_user_sources: true
  entries:
    - name: example-corporate-grype
      type: http
      url: "https://mirror.example.invalid/grype/listing.json"
      tool: grype
      layer: grype-db
      priority: 50
      auth_env: "GRYPE_CUSTOM_AUTH_TOKEN"
      enabled: false
      trust_level: internal
      notes: "Enable and replace with your corporate mirror URL."
    - name: example-custom-trivy-db
      type: oci-registry
      url: "oci://registry.example.invalid/custom-trivy-db"
      tool: trivy
      layer: trivy-db
      priority: 60
      auth_env: "TRIVY_INTERNAL_REGISTRY_PASSWORD"
      enabled: false
      trust_level: custom
      notes: "Use for user-managed OCI mirrors."
