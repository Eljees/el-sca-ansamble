[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options applied to every invocation.  --strict-markers protects
# from typos in custom marker names.  --tb=short keeps tracebacks digestible
# during development without losing the failure context.
addopts =
    --strict-markers
    --tb=short
    --color=yes

# Suppress third-party deprecation warnings that are not actionable in this project.
filterwarnings =
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:fastapi
    ignore::Warning:starlette
    ignore::Warning:fastapi
    # httpx/starlette TestClient leaves sockets unclosed on Python 3.12+ — upstream issue.
    ignore::ResourceWarning

# Custom markers.  Tests touching docker compose / network / heavy IO MUST
# be marked so CI can opt-in / opt-out cleanly.  See docs/audit/ for the
# current test strategy (latest: 300-fixups-2026-06-12.md).
markers =
    smoke: fast critical-path sanity tests; run with -m smoke as a quick gate before the full suite
    slow: takes > 5 seconds
    integration: needs Docker / compose / real network; excluded by default in CI (run with -m integration)
