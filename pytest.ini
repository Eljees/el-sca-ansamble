[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options applied to every invocation.  --strict-markers protects
# from typos in custom marker names.  --tb=short keeps tracebacks digestible
# during development without losing the failure context.
addopts =
    --strict-markers
    --tb=short
    --color=yes

# Custom markers.  Tests touching docker compose / network / heavy IO MUST
# be marked so CI can opt-in / opt-out cleanly.  See docs/audit/30-tests.md
# section 3 for the integration plan.
markers =
    smoke: heavy-ish integration tests that need docker compose or network
    slow: takes > 5 seconds
